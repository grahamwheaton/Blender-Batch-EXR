name: Test and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name BlenderBatchEXR launcher.py
      - run: python -m PyInstaller --noconfirm --onefile --console --exclude-module tkinter --name BlenderBatchEXR-CLI cli_launcher.py
      - run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: BlenderBatchEXR-Windows-x64
          path: dist/BlenderBatchEXR-Windows-x64.zip
